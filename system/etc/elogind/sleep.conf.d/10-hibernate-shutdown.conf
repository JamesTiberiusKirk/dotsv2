# Hibernate must NOT use the ACPI S4 handoff (found on binstar, safe everywhere).
#
# elogind's default is `HibernateMode=platform shutdown` — a list tried in
# order, and it writes the first entry to /sys/power/disk right before
# hibernating, stomping anything set by hand. On this firmware `platform`
# writes the image, enters S4, and bounces straight back out ~40ms later:
#
#   ACPI: PM: Preparing to enter system sleep state S4
#   ACPI: PM: Restoring platform NVS memory
#   ACPI: PM: Waking up from system sleep state S4
#   cs35l41-hda ... cs35l41_system_resume returns -110
#
# The machine never powers down; it returns from a sleep that never happened
# with devices already torn down, and sits frozen (no keyboard, touch or pad).
#
# `shutdown` writes the image and then does a plain pm_power_off(), skipping
# ACPI entirely. Resume is unaffected (it was always fine — resume=UUID +
# resume_offset= on the limine cmdline).
[Sleep]
HibernateMode=shutdown
