# Intel SOF card splits Speaker and Headphones into two mutually exclusive
# profiles instead of two ports on one sink. Two problems follow:
#
# 1. WirePlumber restores the last "user-selected" profile from
#    ~/.local/state/wireplumber/default-profile, and that beats every priority
#    rule (device/find-stored-profile runs before device/find-preferred-profile).
#    .scripts/jack-watch switches profiles with pactl, which WirePlumber records
#    as a user choice -- so one headphone plug pins the card to Headphones for
#    good. Anything that re-triggers profile selection (plugging an external
#    monitor changes HDMI port availability) then restores Headphones and the
#    speaker sink disappears. Turning off restore makes that state file inert.
#
#    Cost: this setting is global, there is no per-device opt-out. Bluetooth
#    devices no longer remember a stored profile either; the AirPods come up on
#    a2dp instead of "off". Accepted.
#
# 2. With restore off, selection falls through to priorities. The Headphones
#    profile has the higher built-in priority, so name the Speaker one
#    explicitly -- an empty jack must mean speakers.
#
# jack-watch still overrides both at runtime by following the jack.

wireplumber.settings = {
  device.restore-profile = false
}

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" }
    ]
    actions = {
      update-props = {
        priorities = [
          "HiFi (HDMI1, HDMI2, HDMI3, Mic1, Speaker)"
        ]
      }
    }
  }
]
