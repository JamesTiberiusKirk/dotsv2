# Intel SOF card splits Speaker and Headphones into two exclusive profiles.
# WirePlumber defaults to the Headphones one (higher priority) even with the
# jack empty, e.g. after a dock plug-in, so the speaker sink vanishes.
# Pin the Speaker profile; a real headphone plug still overrides via jack detection.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" } ]
    actions = { update-props = { device.profile = "HiFi (HDMI1, HDMI2, HDMI3, Mic1, Speaker)" } }
  }
]
