# hyprlock — colors come from theme-apply ($bg/$fg/$dim/$accent/$accentText/
# $urgent in colors-hyprlock.conf, regenerated per theme; sources are tracked,
# the copy is gitignored like the other generated color files).
# Launched by hypridle (see scripts/idle).

source = ~/.config/hypr/colors-hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor =
    # symlink kept by wallpaper.sh pointing at the applied image
    path = ~/.local/state/wallpaper-current
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 12
    inner_color = $bg
    outer_color = $accent
    font_color = $fg
    check_color = $accent
    fail_color = $urgent
    placeholder_text =
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $dim
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}
