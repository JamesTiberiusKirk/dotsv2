# keyd config
# Devices:
#   048d:c100 — ITE Tech. Inc. ITE Device(8910) Keyboard (Lenovo Legion built-in)
#   0001:0001 — AT Translated Set 2 keyboard (Dell built-in / generic PS2)
#   05ac:0250 — Keychron K2 (reports as Apple Aluminium Keyboard ISO)
#   0b05:1bf2:fb4e90cd — Asus Zenbook Duo keyboard, docked over the pogo pins.
#     The third field is keyd 2.6's per-node hash, and it matters: this keyboard
#     exposes four nodes under the one 0b05:1bf2 id, and one of them (event6)
#     reports keys AND absolute coordinates. Matched by plain vendor:product,
#     keyd grabs that node too and replays the touchpad through its virtual
#     pointer as ABSOLUTE motion — a finger on the pad teleports the cursor to
#     the matching corner of the screen. The hash pins us to event29, the real
#     keyboard, and leaves event6 alone. Get it from `sudo keyd monitor`.
#   0b05:1bf3 — the same keyboard lifted off, over bluetooth. A DIFFERENT id, so
#     the entry above does not cover it: detached, keyd was not grabbing the
#     keyboard at all and the nav layer simply did not exist (alt+hjkl arrived
#     at apps as literal alt+h, which terminals bind themselves and so appeared
#     to work, while everything else got nothing).
#     NEEDS THE HASH, same as 1bf2. k:0b05:1bf3 was tried and is wrong: keyd
#     classifies the touchpad node as a keyboard too (it carries KEY alongside
#     ABS), grabs it, and replays it through the virtual pointer as absolute
#     motion — the cursor teleports to the corner matching your finger. The k:
#     prefix does not save you here. Pin the real keyboard node (event3, the
#     one with `kbd leds`) by hash from `sudo keyd monitor`.
#     capslock→ctrl for the detached case is ALSO still set in hypr/base.lua
#     (kb_options); that stays as the fallback for when keyd is not running.
#
# Mirrors part of the Corne ZMK layout:
#   - CapsLock → Ctrl (like the Corne's LCTRL in the caps position)
#   - LeftAlt (hold) → Nav layer: HJKL → arrow keys (vim-style, matches lower_layer)
#   - Use RightAlt for normal alt combos (alt+tab, etc.)

[ids]
# Match keyboard-class devices only. The generic 0001:0001 ID can otherwise
# collide with non-keyboard devices on some laptops.
k:048d:c100
k:0001:0001
k:05ac:0250
0b05:1bf2:fb4e90cd

[main]
capslock = layer(control)
leftalt = layer(nav)

[nav]
h = left
j = down
k = up
l = right
